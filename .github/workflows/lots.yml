name: update-lots
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch active lots
        run: |
          curl -fsS --retry 4 --retry-all-errors "https://dropdealer.ru/api/lots?limit=100&status=active" -o raw.json
          python3 .github/lots.py raw.json lots.json
          rm raw.json
      - name: Commit if changed
        run: |
          git config user.name "lots-bot"
          git config user.email "lots-bot@users.noreply.github.com"
          git add lots.json
          git diff --cached --quiet || (git commit -m "update lots" && git push)
